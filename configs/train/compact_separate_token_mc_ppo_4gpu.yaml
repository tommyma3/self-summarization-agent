experiment:
  name: qwen-bcplus-token-mc-ppo-4gpu
  seed: 0
  output_root: /124090467/self-summarization-agent/experiments/token-mc-bcplus-4gpu/
  bc_plus_root: /124090467/self-summarization-agent/bc-plus
dataset:
  split_seed: 0
  decrypted_path: /124090467/self-summarization-agent/bc-plus/data/browsecomp_plus_decrypted.jsonl
  offset: 0
  limit: null
  shuffle: true
  train_limit: 730
  eval_limit: 100
collection:
  train_task_count: 50
  eval_task_count: 100
retrieval:
  backend: faiss
  top_k: 5
  snippet_max_tokens: 512
  document_max_tokens: 8192
  snippet_tokenizer_path: /124090467/Qwen/Qwen3.5-9B
  persistent_worker: true
  worker_startup_timeout_seconds: 600
  gpu_ids:
  - 0
  search_max_batch_size: 25
  index_path: /124090467/self-summarization-agent/bc-plus/indexes/qwen3-embedding-8b/corpus.shard*.pkl
  model_name: /124090467/Qwen/Qwen3-Embedding-8B
  normalize: true
  pooling: eos
  torch_dtype: bfloat16
  dataset_name: /124090467/hf_datasets/Tevatron/browsecomp-plus-corpus
  max_length: 16384
model:
  backend: transformers
  model_path: /124090467/Qwen/Qwen3.5-9B
  dtype: bfloat16
  device_map: auto
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  trust_remote_code: false
  enable_thinking: true
  chat_template_path: src/self_summarization_agent/chat_templates/qwen3_5_agent.jinja
rollout:
  backend: vllm_offline
  gpu_ids:
  - 2
  - 3
  tensor_parallel_size: 2
  attention_backend: null
  max_model_len: 27000
  enable_prefix_caching: true
  max_concurrent_episodes: 25
  overlap_judge: true
  overlap_queue_max_batches: 16
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  api_base_url: http://127.0.0.1:8000/v1
  api_model: null
  api_key_env: OPENAI_API_KEY
  api_timeout_seconds: 600
  api_max_retries: 2
  api_extra_body: {}
  require_exact_token_ids: true
evaluation:
  samples_per_task: 1
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  extra_sampling_params: {}
runtime:
  context_threshold_tokens: 12000
  max_context_tokens: 28000
  max_summary_tokens: 6400
  tool_budget: 99999
  generated_token_budget: 36000
  phase_timeout_seconds: 9000
  train_update_timeout_seconds: 21600
judge:
  enabled: true
  backend: vllm_offline
  model_path: /124090467/Qwen/Qwen3.8-27B
  gpu_ids:
  - 0
  - 1
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.7
  attention_backend: null
  max_model_len: 12000
  max_new_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 32
  batch_wait_ms: 25
  batch_timeout_seconds: 600
training:
  advantage_estimator: token_mc_value
  value:
    enabled: true
    architecture: separate
    model_path: /124090467/Qwen/Qwen3.5-0.8B
    learning_rate: 1.0e-05
    head_learning_rate: 1.0e-05
    fitting_epochs: 3
    rollout_minibatch_size: 32
    prefix_microbatch_size: 4
    eval_prefix_microbatch_size: 4
    max_prefix_tokens_per_batch: 108000
    length_bucketing: true
    activation_checkpointing: true
    eval_before_fit: false
    eval_every_n_epochs: 0
    evalset_interval: 5
    diagnostics_interval: 5
    progress_interval_seconds: 30
    max_grad_norm: 1.0
    gpu_id: 0
    gpu_ids: [0, 1, 2, 3]
    seed: 0
    zero_initialize_head: true
    num_bins: 2
    baseline_timing: pre_fit
    reward_profile: signed_binary
  backend: verl_ray
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
  fsdp_version: 2
  context_parallel_size: 1
  tensor_parallel_size: 1
  data_parallel_size: 4
  activation_checkpointing: true
  max_sequence_length: 27000
  epochs: 10
  steps: 10
  group_size: 4
  update_epochs: 2
  minibatch_size: 128
  clip_range: 0.2
  target_kl: null
  gradient_accumulation_microbatch_size: 1
  learning_rate: 1.0e-06
  checkpoint_interval: 5
  eval_interval: 0
  max_grad_norm: 1.0
  verl:
    address: null
    namespace: self-summarization-agent
    num_cpus: null
    num_gpus_per_worker: 4
    runtime_env:
      env_vars:
        VIRTUAL_ENV: /124090467/self-summarization-agent/.venv
        PATH: /root/.local/bin:/124090467/self-summarization-agent/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: '0'
        PYTORCH_ALLOC_CONF: expandable_segments:True
      excludes:
      - pyproject.toml
      - .python-version
      - uv.lock
      - /.git/
      - /.venv/
      - /experiments/
      - /bc-plus/
      - /artifacts/
      - /runs/
      - /.pytest_cache/
    worker_backend: verl_fsdp
    fsdp:
      strategy: fsdp
      ppo_micro_batch_size_per_gpu: 2
      ppo_max_token_len_per_gpu: 16384
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_max_token_len_per_gpu: 12288
      use_dynamic_bsz: true
      use_remove_padding: true
      use_torch_compile: false
      ulysses_sequence_parallel_size: 4
      forward_prefetch: true
      param_offload: false
      optimizer_offload: false
      fsdp_size: 4
      save_hf_model: true
    ignore_reinit_error: true
    log_to_driver: true
    shutdown_ray: true
  train_compaction_tokens: true
benchmark:
  name: browsecomp
