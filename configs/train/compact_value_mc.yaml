experiment:
  name: qwen-bcplus-compact-value-mc
  seed: 0
  output_root: /124090467/self-summarization-agent/experiments/compact-value-mc/
  bc_plus_root: /124090467/self-summarization-agent/bc-plus

dataset:
  decrypted_path: /124090467/self-summarization-agent/bc-plus/data/browsecomp_plus_decrypted.jsonl
  offset: 0
  limit:
  shuffle: false
  train_limit: 780
  eval_limit: 50

collection:
  train_task_count: 50
  eval_task_count: 50

retrieval:
  backend: faiss
  top_k: 5
  snippet_max_tokens: 512
  document_max_tokens: 8192
  snippet_tokenizer_path: /124090467/Qwen/Qwen3.5-9B
  persistent_worker: true
  worker_startup_timeout_seconds: 600
  # Keep the embedding model and sharded FAISS index off policy GPUs 2-3.
  gpu_ids: [0, 1]
  # Chunk batched searches so the embedding model never receives all
  # max_concurrent_episodes queries in a single forward pass.
  search_max_batch_size: 25
  index_path: /124090467/self-summarization-agent/bc-plus/indexes/qwen3-embedding-8b/corpus.shard*.pkl
  model_name: /124090467/Qwen/Qwen3-Embedding-8B
  normalize: true
  pooling: eos
  torch_dtype: bfloat16
  dataset_name: /124090467/hf_datasets/Tevatron/browsecomp-plus-corpus
  max_length: 16384

model:
  backend: transformers
  model_path: /124090467/Qwen/Qwen3.5-9B
  dtype: bfloat16
  # Spread the trainable backbone, gradients, and optimizer state across all
  # four reserved GPUs instead of letting auto-placement pack weights on GPU 0.
  device_map: balanced
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  trust_remote_code: false
  enable_thinking: true
  chat_template_path: src/self_summarization_agent/chat_templates/qwen3_5_agent.jinja

rollout:
  backend: vllm_offline
  gpu_ids: [2, 3]
  tensor_parallel_size: 2
  attention_backend:
  # Keep rollout limits identical to the default training experiment.
  max_model_len: 27000
  enable_prefix_caching: true
  max_concurrent_episodes: 25
  # Deprecated compatibility fields; merged_collect is strictly sequential.
  overlap_judge: false
  overlap_queue_max_batches: 8
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  api_base_url: http://127.0.0.1:8000/v1
  api_model:
  api_key_env: OPENAI_API_KEY
  api_timeout_seconds: 600
  api_max_retries: 2
  api_extra_body: {}
  require_exact_token_ids: true

evaluation:
  samples_per_task: 1
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  extra_sampling_params: {}

runtime:
  # Match the default compaction and context thresholds exactly.
  context_threshold_tokens: 12000
  max_context_tokens: 28000
  max_summary_tokens: 6400
  tool_budget: 99999
  generated_token_budget: 36000
  phase_timeout_seconds: 9000
  # Value training performs an additional frozen-value pass. Keep collection
  # on the normal phase limit while allowing a fully instrumented update up to
  # six hours; remote timings should be used to tighten this after the first
  # successful full-size iteration.
  train_update_timeout_seconds: 21600

judge:
  enabled: true
  backend: vllm_offline
  model_path: /124090467/Qwen/Qwen3.5-35B-A3B
  gpu_ids: [0, 1, 2, 3]
  tensor_parallel_size: 4
  attention_backend:
  max_model_len: 12000
  max_new_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 32
  batch_wait_ms: 25
  batch_timeout_seconds: 600

training:
  # Monte Carlo actor-critic at append-only interval-start states.
  advantage_estimator: compaction_mc_value
  value:
    enabled: true
    loss_coefficient: 0.5
    zero_initialize_head: true
    state_anchor: first_generation_prompt_end
  backend: verl_ray
  gpu_ids: [0, 1, 2, 3]
  fsdp_version: 2
  context_parallel_size: 1
  tensor_parallel_size: 1
  data_parallel_size: 4
  activation_checkpointing: true
  # Match the default training cap. Longer intervals fail closed rather than
  # being left-truncated, preserving the append-only trajectory contract.
  max_sequence_length: 24000
  epochs: 10
  steps: 10
  group_size: 4
  # The Transformers actor-critic materializes token logits and the final
  # hidden state together. Keep one sequence per forward/backward and only
  # accumulate four intervals before each optimizer step to bound GPU memory.
  update_epochs: 1
  minibatch_size: 4
  clip_range: 0.2
  target_kl: 0.03
  gradient_accumulation_microbatch_size: 1
  learning_rate: 1.0e-6
  checkpoint_interval: 5
  eval_interval: 0
  max_grad_norm: 1.0
  verl:
    address:
    namespace: self-summarization-agent
    num_cpus:
    # Reserve all four GPUs for the single model-parallel Transformers actor.
    num_gpus_per_worker: 4
    runtime_env:
      env_vars:
        VIRTUAL_ENV: "/124090467/self-summarization-agent/.venv"
        PATH: "/root/.local/bin:/124090467/self-summarization-agent/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        PYTORCH_ALLOC_CONF: "expandable_segments:True"
      excludes:
        - "pyproject.toml"
        - ".python-version"
        - "uv.lock"
    worker_backend: transformers
    fsdp:
      strategy: fsdp
      ppo_micro_batch_size_per_gpu: 1
      ppo_max_token_len_per_gpu: 12288
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_max_token_len_per_gpu: 12288
      use_dynamic_bsz: true
      use_remove_padding: true
      use_torch_compile: true
      ulysses_sequence_parallel_size: 4
      forward_prefetch: true
      param_offload: true
      optimizer_offload: true
      fsdp_size: -1
      save_hf_model: true
    ignore_reinit_error: true
    log_to_driver: true
    shutdown_ray: true
