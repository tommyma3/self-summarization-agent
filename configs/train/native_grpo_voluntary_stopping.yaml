experiment:
  name: qwen-bcplus-native-grpo-voluntary-stopping
  seed: 0
  output_root: /124090467/self-summarization-agent/
  bc_plus_root: /124090467/self-summarization-agent/bc-plus

benchmark:
  name: browsecomp
  reward_profile: voluntary_stopping

dataset:
  # Fixed partition shared across methods; independent of experiment.seed.
  split_seed: 0
  decrypted_path: /124090467/self-summarization-agent/bc-plus/data/browsecomp_plus_decrypted.jsonl
  offset: 0
  limit:
  shuffle: false
  train_limit: 730
  eval_limit: 100

collection:
  train_task_count: 50
  eval_task_count: 100

retrieval:
  backend: faiss
  top_k: 5
  snippet_max_tokens: 512
  document_max_tokens: 8192
  snippet_tokenizer_path: /124090467/Qwen/Qwen3.5-9B
  persistent_worker: true
  worker_startup_timeout_seconds: 600
  # Keep the embedding model and sharded FAISS index off policy GPUs 2-3.
  gpu_ids: [0, 1]
  index_path: /124090467/self-summarization-agent/bc-plus/indexes/qwen3-embedding-8b/corpus.shard*.pkl
  model_name: /124090467/Qwen/Qwen3-Embedding-8B
  normalize: true
  pooling: eos
  torch_dtype: bfloat16
  dataset_name: /124090467/hf_datasets/Tevatron/browsecomp-plus-corpus
  max_length: 16384

model:
  model_path: /124090467/Qwen/Qwen3.5-9B
  dtype: bfloat16
  device_map: auto
  max_new_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  do_sample: true
  trust_remote_code: false
  enable_thinking: true
  chat_template_path: src/self_summarization_agent/chat_templates/qwen3_5_initial.jinja

rollout:
  backend: vllm_offline
  gpu_ids: [2, 3]
  tensor_parallel_size: 2
  attention_backend:
  max_model_len: 27000
  enable_prefix_caching: true
  max_concurrent_episodes: 50
  completion_driven: true
  # Each scorer loads the frozen policy after collection and judging finish.
  cache_gpu_ids: [0, 1, 2, 3]
  overlap_judge: true
  overlap_queue_max_batches: 16
  max_new_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  do_sample: true
  # Used only when rollout.backend is switched to openai_compatible. The server
  # must expose the checkpoint and support vLLM's return_token_ids extension.
  api_base_url: http://127.0.0.1:8000/v1
  api_model:
  api_key_env: OPENAI_API_KEY
  api_timeout_seconds: 600
  api_max_retries: 2
  api_extra_body: {}
  require_exact_token_ids: true
  browsecomp_native_tools: true
  extra_sampling_params:
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0

evaluation:
  samples_per_task: 1
  # Qwen3.5 recommended thinking-mode sampling.
  temperature: 1.0
  top_p: 0.95
  do_sample: true
  extra_sampling_params:
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0

runtime:
  context_threshold_tokens: 16000
  max_context_tokens: 28000
  # Summary-body cap. An overlong summary terminates the rollout with reward 0.
  max_summary_tokens: 6400
  # At the fourth-interval threshold, training requests a final answer and evaluation ends as overlong.
  max_compactions: 3
  force_answer_at_compaction_limit: true
  # Per-phase subprocess timeout (seconds). If a rollout/judge/train subprocess
  # does not exit within this limit it is terminated. None = no timeout.
  phase_timeout_seconds: 9000

judge:
  enabled: true
  backend: vllm_offline
  model_path: /124090467/Qwen/Qwen3.8-27B
  gpu_ids: [0, 1]
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.7
  attention_backend:
  max_model_len: 12000
  max_new_tokens: 8192
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  # Judge completed answers in batches while the policy collects more rollouts.
  batch_size: 32
  batch_wait_ms: 25
  # Maximum seconds a single judge micro-batch may take before the worker
  # returns an error and moves on. 0 disables the timeout.
  batch_timeout_seconds: 600

training:
  advantage_estimator: group_relative
  backend: verl_ray
  gpu_ids: [0, 1, 2, 3]
  fsdp_version: 2
  context_parallel_size: 1
  tensor_parallel_size: 1
  data_parallel_size: 4
  activation_checkpointing: true
  # Allow cached intervals collected before tool responses were bounded.
  max_sequence_length: 28000
  epochs: 10
  steps: 10
  group_size: 4
  update_epochs: 2
  minibatch_size: 128
  clip_range: 0.2
  target_kl: null
  gradient_accumulation_microbatch_size: 2
  learning_rate: 1.0e-6
  checkpoint_interval: 5
  eval_interval: 0
  max_grad_norm: 1.0
  verl:
    address:
    namespace: self-summarization-agent
    num_cpus:
    num_gpus_per_worker:
    runtime_env:
      env_vars:
        VIRTUAL_ENV: "/124090467/self-summarization-agent/.venv"
        PATH: "/root/.local/bin:/124090467/self-summarization-agent/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        PYTORCH_ALLOC_CONF: "expandable_segments:True"
      excludes:
        - "pyproject.toml"
        - ".python-version"
        - "uv.lock"
    worker_backend: verl_fsdp
    fsdp:
      strategy: fsdp
      # Project the vocabulary head only at retained policy targets.
      sparse_policy_head: true
      # Keep zero-advantage intervals in group statistics and PPO diagnostics.
      zero_advantage_forward_only: true
      ppo_micro_batch_size_per_gpu: 1
      ppo_max_token_len_per_gpu: 12288
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_max_token_len_per_gpu: 12288
      use_dynamic_bsz: true
      use_remove_padding: true
      use_torch_compile: true
      ulysses_sequence_parallel_size: 4
      forward_prefetch: true
      param_offload: true
      optimizer_offload: true
      fsdp_size: -1
      save_hf_model: true
    ignore_reinit_error: true
    log_to_driver: true
    shutdown_ray: true
