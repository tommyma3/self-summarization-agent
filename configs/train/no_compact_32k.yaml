experiment:
  name: qwen-bcplus-no-compact-32k-train
  seed: 0
  output_root: /124090467/self-summarization-agent/
  bc_plus_root: /124090467/self-summarization-agent/bc-plus

dataset:
  decrypted_path: /124090467/self-summarization-agent/bc-plus/data/browsecomp_plus_decrypted.jsonl
  offset: 0
  limit:
  shuffle: false
  train_limit: 780
  eval_limit: 50

collection:
  train_task_count: 50
  eval_task_count: 50

retrieval:
  backend: faiss
  top_k: 5
  snippet_max_tokens: 512
  document_max_tokens: 8192
  snippet_tokenizer_path: /124090467/Qwen/Qwen3.5-9B
  persistent_worker: true
  worker_startup_timeout_seconds: 600
  index_path: /124090467/self-summarization-agent/bc-plus/indexes/qwen3-embedding-8b/corpus.shard*.pkl
  model_name: /124090467/Qwen/Qwen3-Embedding-8B
  normalize: true
  pooling: eos
  torch_dtype: bfloat16
  dataset_name: /124090467/hf_datasets/Tevatron/browsecomp-plus-corpus
  max_length: 16384

model:
  backend: transformers
  model_path: /124090467/Qwen/Qwen3.5-9B
  dtype: bfloat16
  device_map: auto
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  trust_remote_code: false
  enable_thinking: true
  chat_template_path: src/self_summarization_agent/chat_templates/qwen3_5_agent.jinja

rollout:
  backend: sglang
  gpu_ids: [2, 3]
  tensor_parallel_size: 2
  attention_backend:
  max_model_len: 49152
  enable_prefix_caching: false
  # Limit KV-cache residency on the two rollout GPUs for long-context episodes.
  max_concurrent_episodes: 50
  # Deprecated compatibility fields; merged_collect is strictly sequential.
  overlap_judge: false
  overlap_queue_max_batches: 20
  max_new_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  # Used only when rollout.backend is switched to openai_compatible. The server
  # must expose the checkpoint and support vLLM's return_token_ids extension.
  api_base_url: http://127.0.0.1:8000/v1
  api_model:
  api_key_env: OPENAI_API_KEY
  api_timeout_seconds: 600
  api_max_retries: 2
  api_extra_body: {}
  require_exact_token_ids: true
  # Per-split timeout for the collection subprocess. Each split (eval, train)
  # runs as a separate child process; this gives a tighter failure boundary than
  # the outer phase_timeout_seconds alone. None = no limit.
  per_split_collection_timeout_seconds: 5400

evaluation:
  samples_per_task: 1
  # Deterministic evaluation — measures the policy's most-likely output
  # rather than a stochastic draw. Independent from the GRPO exploration policy.
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  extra_sampling_params: {}

runtime:
  # Effectively disable runtime summarization for the no-compaction baseline.
  context_threshold_tokens: 1000000000
  max_context_tokens: 40960
  # Summary-body cap. Irrelevant when compaction is disabled, kept for field
  # parity with the default config.
  max_summary_tokens: 6400
  tool_budget: 99999
  # Episode budget: model completions plus raw appended tool-result content.
  generated_token_budget: 36000
  # Per-phase subprocess timeout (seconds). If a rollout/judge/train subprocess
  # does not exit within this limit it is terminated. None = no timeout.
  phase_timeout_seconds: 9000
  # Maximum wall-clock seconds for all retrieval tool calls (search + get_document)
  # within a single collection round. Remaining calls are skipped with an error
  # string so the episode can still produce a result.
  tool_execution_timeout_seconds: 600

judge:
  enabled: true
  backend: sglang
  model_path: /124090467/Qwen/Qwen3.5-35B-A3B
  gpu_ids: [0, 1, 2, 3]
  tensor_parallel_size: 4
  attention_backend:
  max_model_len: 18000
  max_new_tokens: 12000
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  # Batch completed eval and training answers after policy/retrieval teardown.
  batch_size: 32
  batch_wait_ms: 25
  # Maximum seconds a single judge micro-batch may take before the worker
  # returns an error and moves on. 0 disables the timeout.
  batch_timeout_seconds: 600

training:
  backend: verl_ray
  gpu_ids: [0, 1, 2, 3]
  fsdp_version: 2
  context_parallel_size: 1
  tensor_parallel_size: 1
  data_parallel_size: 4
  activation_checkpointing: true
  # Preserve the full 49,152-token rollout (40,960 context + 8,192 generation)
  # so no-compaction sequences are never left-truncated by the training adapter.
  max_sequence_length: 49152
  epochs: 10
  steps: 10
  group_size: 4
  update_epochs: 2
  minibatch_size: 128
  clip_range: 0.2
  target_kl: 0.03
  gradient_accumulation_microbatch_size: 1
  learning_rate: 1.0e-6
  checkpoint_interval: 5
  eval_interval: 0
  max_grad_norm: 1.0
  verl:
    address:
    namespace: self-summarization-agent
    num_cpus:
    num_gpus_per_worker:
    runtime_env:
      env_vars:
        VIRTUAL_ENV: "/124090467/self-summarization-agent/.venv"
        PATH: "/root/.local/bin:/124090467/self-summarization-agent/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        PYTORCH_ALLOC_CONF: "expandable_segments:True"
      excludes:
        - "pyproject.toml"
        - ".python-version"
        - "uv.lock"
    worker_backend: verl_fsdp
    fsdp:
      strategy: fsdp
      ppo_micro_batch_size_per_gpu: 1
      ppo_max_token_len_per_gpu: 12288
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_max_token_len_per_gpu: 12288
      use_dynamic_bsz: true
      use_remove_padding: true
      use_torch_compile: true
      # Ulysses splits long-sequence activation work across all four ranks.
      ulysses_sequence_parallel_size: 4
      forward_prefetch: true
      param_offload: true
      optimizer_offload: true
      fsdp_size: -1
      save_hf_model: true
    ignore_reinit_error: true
    log_to_driver: true
    shutdown_ray: true
