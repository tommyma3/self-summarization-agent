# CompactionRL reference selection; set prepared_task_root to the prepared SWE-Dev Harbor task directory.
experiment:
  name: swe-dev-grpo
  seed: 0
  output_root: artifacts/swe-dev/experiment
benchmark:
  name: swe-dev
  dataset: compactionrl-swe-dev
  dataset_revision: c0727751da3d1edfdfb5cc55fba5c6e30f67ce00
  reward_profile: binary_zero_one
  environment: docker
  image_profile: text-only
  train_manifest_path: configs/train/data/swedev_reference_1105.json
  prepared_task_root: artifacts/swe-dev/prepared-swedev-tasks
dataset: {}
collection:
  train_task_count: null
  eval_task_count: 0
retrieval: {}
model:
  model_path: /124090467/Qwen/Qwen3.5-9B
  dtype: bfloat16
  max_new_tokens: 4096
  enable_thinking: true
  chat_template_path: src/self_summarization_agent/chat_templates/qwen3_5_initial.jinja
  temperature: 0.6
  top_p: 0.95
  do_sample: true
rollout:
  backend: vllm_offline
  gpu_ids:
  - 0
  tensor_parallel_size: 1
  max_model_len: 32768
  max_concurrent_episodes: 1
  require_exact_token_ids: true
  overlap_judge: false
  temperature: 0.6
  top_p: 0.95
  do_sample: true
  extra_sampling_params:
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

evaluation:
  samples_per_task: 1
  temperature: 0.6
  do_sample: true
  top_p: 0.95
  extra_sampling_params:
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

runtime:
  context_threshold_tokens: 16000
  max_context_tokens: 32768
  max_summary_tokens: 2048
  tool_budget: 200
  generated_token_budget: 64000
  tool_execution_timeout_seconds: 600
judge:
  enabled: false
training:
  backend: transformers
  max_sequence_length: 32768
  group_size: 4
  train_compaction_tokens: true
  advantage_estimator: group_relative
  update_epochs: 1
  minibatch_size: 4
  gradient_accumulation_microbatch_size: 1
  learning_rate: 1.0e-06
  target_kl: null
  value_pretraining:
    enabled: false
  value:
    enabled: false
